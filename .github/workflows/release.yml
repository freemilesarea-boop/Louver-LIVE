name: Release artifacts

# Builds the installers the product is sold as: Windows x64, macOS Apple
# Silicon and macOS Intel. A .app or a .exe can only be produced on its own
# operating system, so they come from here rather than a developer's machine.
#
# Linux is deliberately absent. The app still builds and its tests still run
# on Linux — that is what CI is for — but no .deb or .AppImage is produced
# here and none is attached to a release. Adding one back means adding a
# matrix entry and the webkit/patchelf/fuse dependencies it needs.
#
# Run it from the Actions tab (workflow_dispatch) for a test build, or push a
# v* tag to publish a GitHub Release with the installers attached.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a draft GitHub Release as well as the run artifacts'
        type: boolean
        default: false
      tag:
        description: 'Tag for that draft release, e.g. v1.0.0. Leave empty for a dated draft.'
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14           # arm64 runner
            target: aarch64-apple-darwin
          - label: macOS Intel
            # Not `macos-13`. That label was never given a runner: the v1.0.0
            # tag's Intel job sat queued for over an hour without starting a
            # step, and a CI run that asked for both labels at once had this
            # one finish while `macos-13` was still waiting. Nothing in the
            # job was wrong — there was no machine to run it on.
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # The three checks that decide whether this build may ship the FFmpeg
      # it just downloaded. Shared with CI, which runs them on every push for
      # all four targets: when they ran only here, a tag was the first thing
      # to discover that macOS ships ffprobe in its own archive and that the
      # Windows provenance file was being looked for under the wrong name.
      - name: Place and check the FFmpeg sidecars
        uses: ./.github/actions/sidecars
        with:
          target: ${{ matrix.target }}

      # Everything the product claims about itself, on the platform it is
      # about to be shipped for. A release is the wrong place to discover that
      # a test only ever ran on Linux.
      - name: Verify the application
        run: npm run verify

      # A signing variable that exists but is empty is not the same as one
      # that is absent, and Tauri reads it with `var_os`, which cannot tell
      # them apart. Listing the secrets under the build step's `env:` set
      # every one of them — empty for a repository that has no certificate —
      # so Tauri decided the build was signed, ran `security import` on an
      # empty certificate and stopped:
      #   security: SecKeychainItemImport: One or more parameters passed to a
      #   function were not valid.
      #   failed to bundle project: failed codesign application
      # Both macOS jobs died there on v1.0.1, after compiling cleanly. So the
      # variables are exported here, and only the ones that actually hold
      # something. Names only in the log, never values.
      - name: Export the signing material, if this repository has any
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # The updater signing key. Never stored in the repository; see
          # SIGNING.md for how it is generated and where it lives.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          any=no
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            # The heredoc form, because a private key is several lines.
            {
              printf '%s<<LOUVER_SIGNING_EOF\n' "$name"
              printf '%s\n' "$value"
              printf 'LOUVER_SIGNING_EOF\n'
            } >> "$GITHUB_ENV"
            echo "$name: provided"
            any=yes
          done
          if [ "$any" = no ]; then
            echo "::warning::no signing material in this repository — the installers will be unsigned"
          fi

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        env:
          # The OAuth client baked into the release, so the user never meets
          # the Google Cloud console. Both are needed: Google refuses this
          # desktop client's token exchange without the secret. A build
          # without them still runs — the connect button says the build
          # carries no client — so a fork can build without either.
          LOUVER_GOOGLE_CLIENT_ID: ${{ secrets.LOUVER_GOOGLE_CLIENT_ID }}
          LOUVER_GOOGLE_CLIENT_SECRET: ${{ secrets.LOUVER_GOOGLE_CLIENT_SECRET }}
        with:
          # `--verbose` so the bundlers' own tools are quoted when they fail.
          # WiX `light.exe` exited non-zero on v1.0.1 after the NSIS installer
          # had been produced, and Tauri reported only "failed to run
          # light.exe" — the tool's own message was nowhere in the log, so
          # there was nothing to fix from.
          args: --target ${{ matrix.target }} --verbose

      # Proof that the secrets reached rustc, asked of the binary rather than
      # assumed from the fact that the secrets exist. `option_env!` is
      # resolved when louver-core compiles, so a build that saw nothing
      # produces an app that is correct in every other way and whose connect
      # button says it carries no client — and every other check in this job
      # would still pass.
      - name: Check the OAuth client was compiled in
        shell: bash
        # `secrets` is not one of the contexts a step-level `if:` can read, so
        # the presence comes in as an ordinary value and the decision is made
        # in the script.
        env:
          EXPECTED: ${{ secrets.LOUVER_GOOGLE_CLIENT_ID != '' }}
        run: |
          set -uo pipefail
          bin="target/${{ matrix.target }}/release/louver-desktop"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
          # Asked of the binary, with the runner's variables taken away, so
          # the answer is the one a customer gets from Finder or the Start
          # menu and not an echo of this build. Prints whether, never what,
          # and exits non-zero when no client was compiled in.
          if [ "$RUNNER_OS" = "Windows" ]; then
            # A Windows program will not start without SystemRoot, so there
            # the two variables that could answer for the binary are removed
            # rather than the whole environment replaced.
            env -u LOUVER_GOOGLE_CLIENT_ID -u LOUVER_GOOGLE_CLIENT_SECRET \
              "$PWD/$bin" --credential-check
          else
            env -i "$PWD/$bin" --credential-check
          fi
          got=$?
          if [ "$EXPECTED" = "true" ] && [ "$got" -ne 0 ]; then
            echo "::error::the secrets are set but no OAuth client reached the binary"
            exit 1
          fi
          if [ "$EXPECTED" != "true" ]; then
            echo "::warning::built with no OAuth client — YouTube account connection will not work in this build"
          fi

      # What actually got built, recorded next to the artifact — so a tester
      # can tell a signed build from an unsigned one without guessing, and can
      # see whether the release carries an OAuth client at all.
      - name: Describe the artifact
        shell: bash
        run: |
          {
            echo "target:  ${{ matrix.target }}"
            echo "runner:  ${{ matrix.os }}"
            echo "commit:  ${{ github.sha }}"
            echo "ref:     ${{ github.ref_name }}"
            echo "signed:  ${{ secrets.APPLE_SIGNING_IDENTITY != '' || secrets.WINDOWS_CERTIFICATE != '' }}"
            echo "oauth:   ${{ secrets.LOUVER_GOOGLE_CLIENT_ID != '' && secrets.LOUVER_GOOGLE_CLIENT_SECRET != '' }}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD-INFO.txt
          cat BUILD-INFO.txt
          cat rc-results/ffmpeg-manifest.json >> BUILD-INFO.txt || true

      # Collected into one directory so the upload does not have to know each
      # bundler's layout, and so a bundler that produced nothing is caught
      # here rather than by an empty release.
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Cargo puts a cross-compiled build under target/<triple>/release.
          # The workspace target directory is the repository root, not
          # apps/desktop/src-tauri — getting this wrong uploads nothing.
          bundle="target/${{ matrix.target }}/release/bundle"
          ls -R "$bundle" || true
          found=0
          # -print0 and a read loop, because every bundler names its output
          # after the product — "Louver Live_1.0.3_x64_en-US.msi" — and a bare
          # $(find) would split that on the space and copy neither half.
          while IFS= read -r -d '' f; do
            cp "$f" dist-release/
            found=$((found + 1))
          done < <(find "$bundle" -maxdepth 2 -type f \
                     \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no installer was produced for ${{ matrix.target }}"
            exit 1
          fi
          cp BUILD-INFO.txt "dist-release/BUILD-INFO-${{ matrix.target }}.txt"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: louver-live-${{ matrix.target }}
          retention-days: 30
          path: dist-release/*

  # A run artifact expires and needs a GitHub login to download, so it is not
  # something a user can be sent to. A tag publishes a real Release instead.
  publish:
    name: Publish the release
    needs: build
    # Ubuntu only because this job downloads the artifacts the three build
    # jobs made and calls `gh`. It compiles nothing and produces no Linux
    # installer; the cheapest runner is the right one for that.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: louver-live-*
          merge-multiple: true

      - name: List what is being published
        run: ls -la artifacts

      # A draft, not a live release. Every platform here is still marked
      # NOT TESTED against a real YouTube channel in
      # RELEASE_CANDIDATE_REPORT.md, so a person decides when it goes public.
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push names itself. A dispatch may name the tag it wants —
          # the draft release carries it and creates it on publish, which is
          # how a release is cut without push access to refs/tags.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || format('draft-{0}', github.run_number)) }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ## 설치

          | 운영체제 | 받을 파일 |
          | --- | --- |
          | Windows 10/11 (64비트) | `.exe` (권장) 또는 `.msi` |
          | Mac (M1 이상, Apple Silicon) | `aarch64.dmg` |
          | Mac (2020년 이전, Intel) | `x64.dmg` |

          이번 릴리스는 Windows 와 macOS 만 제공합니다.

          설치 파일에는 코드 서명이 없습니다. Windows 는 처음 실행할 때
          SmartScreen 경고가 나옵니다 — `추가 정보` → `실행`을 누르면 됩니다.
          macOS 는 처음 열 때 우클릭 → `열기`를 사용하세요.

          Mac에서 어느 쪽인지 모르시면 왼쪽 위 사과 → **이 Mac에 관하여**를 열어
          "칩"이라고 적혀 있으면 Apple Silicon, "프로세서"라고 적혀 있으면 Intel입니다.

          `BUILD-INFO-*.txt`에 각 빌드의 커밋, 서명 여부, FFmpeg 출처가 들어 있습니다.
          EOF
          )
          gh release create "$TAG" \
            --draft \
            --target "$TARGET" \
            --title "Louver Live $TAG" \
            --notes "$notes" \
            artifacts/* \
            || gh release upload "$TAG" artifacts/* --clobber
          gh release view "$TAG" --json url --jq .url
