name: Release artifacts

# Builds the installers for every platform the product ships on. This
# repository's own CI runs on Linux, and a macOS .app or a Windows .exe can
# only be produced on macOS and Windows respectively — so those artifacts come
# from this workflow rather than from a developer's machine.
#
# Run it from the Actions tab (workflow_dispatch) for a test build, or push a
# v* tag to publish a GitHub Release with the installers attached.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a draft GitHub Release as well as the run artifacts'
        type: boolean
        default: false
      tag:
        description: 'Tag for that draft release, e.g. v1.0.0. Leave empty for a dated draft.'
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14           # arm64 runner
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04       # oldest supported glibc, so the .deb installs widely
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      # Tauri's Linux build needs the webkit stack, and the AppImage bundler
      # needs patchelf and fuse. The other runners need none of it.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf file desktop-file-utils \
            xdg-utils fuse libfuse2

      - run: npm ci

      # No development fallback in a release. If the download hosts cannot be
      # reached the build fails here rather than shipping the runner's own
      # FFmpeg, which is dynamically linked and would not run on a user's
      # machine. --force so a cached workspace cannot supply a stale one.
      - name: Fetch the FFmpeg sidecars
        run: node scripts/fetch-ffmpeg.mjs --require-download --force --target ${{ matrix.target }}

      # The licence, linkage, encoders, protocols and minimum version are read
      # out of the binaries themselves. A build that fails this does not ship.
      - name: Verify the FFmpeg sidecars
        run: node scripts/ffmpeg-manifest.mjs --check

      # The manifest checks what the binaries can do and whether they are
      # self-contained. It cannot check that they are for the machine this
      # installer is aimed at — a download served the wrong asset produces an
      # installer that looks perfect and cannot spawn FFmpeg on the customer's
      # computer. `file` reads the header and says.
      - name: Check the sidecars are built for this target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)    want="PE32\+ executable.*x86-64" ;;
            aarch64-apple-darwin)      want="Mach-O.*arm64" ;;
            x86_64-apple-darwin)       want="Mach-O.*x86_64" ;;
            x86_64-unknown-linux-gnu)  want="ELF 64-bit.*x86-64" ;;
            *) echo "::error::no architecture expectation for ${{ matrix.target }}"; exit 1 ;;
          esac
          for name in ffmpeg ffprobe; do
            bin=$(ls apps/desktop/src-tauri/binaries/$name-${{ matrix.target }}* )
            got=$(file -b "$bin")
            echo "$name: $got"
            grep -Eq "$want" <<<"$got" || {
              echo "::error::$name is not $want — it is: $got"
              exit 1
            }
          done
          # And it is the downloaded build, not the runner's own. The
          # provenance file says which, and fetch-ffmpeg writes the marker.
          for f in apps/desktop/src-tauri/binaries/SOURCE-*.txt; do
            cat "$f"
            grep -q "DEVELOPMENT ONLY" "$f" && {
              echo "::error::$f is the development fallback and must not ship"
              exit 1
            }
          done
          echo "sidecars are the downloaded build for ${{ matrix.target }}"

      # Everything the product claims about itself, on the platform it is
      # about to be shipped for. A release is the wrong place to discover that
      # a test only ever ran on Linux.
      - name: Verify the application
        run: npm run verify

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        env:
          # Present only when the release is signed; tauri-action skips
          # signing when they are absent, which is what an unsigned test
          # build wants.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # The updater signing key. Never stored in the repository; see
          # SIGNING.md for how it is generated and where it lives.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The OAuth client baked into the release, so the user never meets
          # the Google Cloud console. Both are needed: Google refuses this
          # desktop client's token exchange without the secret. A build
          # without them still runs — the connect button says the build
          # carries no client — so a fork can build without either.
          LOUVER_GOOGLE_CLIENT_ID: ${{ secrets.LOUVER_GOOGLE_CLIENT_ID }}
          LOUVER_GOOGLE_CLIENT_SECRET: ${{ secrets.LOUVER_GOOGLE_CLIENT_SECRET }}
        with:
          args: --target ${{ matrix.target }}

      # Proof that the secrets reached rustc, asked of the binary rather than
      # assumed from the fact that the secrets exist. `option_env!` is
      # resolved when louver-core compiles, so a build that saw nothing
      # produces an app that is correct in every other way and whose connect
      # button says it carries no client — and every other check in this job
      # would still pass.
      - name: Check the OAuth client was compiled in
        if: secrets.LOUVER_GOOGLE_CLIENT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/louver-desktop"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
          # Asked of the binary, with an empty environment, so the answer is
          # the one a customer gets from Finder or the Start menu and not an
          # echo of this runner's variables. Prints whether, never what, and
          # exits non-zero when no client was compiled in.
          env -i "$PWD/$bin" --credential-check

      # What actually got built, recorded next to the artifact — so a tester
      # can tell a signed build from an unsigned one without guessing, and can
      # see whether the release carries an OAuth client at all.
      - name: Describe the artifact
        shell: bash
        run: |
          {
            echo "target:  ${{ matrix.target }}"
            echo "runner:  ${{ matrix.os }}"
            echo "commit:  ${{ github.sha }}"
            echo "ref:     ${{ github.ref_name }}"
            echo "signed:  ${{ secrets.APPLE_SIGNING_IDENTITY != '' || secrets.WINDOWS_CERTIFICATE != '' }}"
            echo "oauth:   ${{ secrets.LOUVER_GOOGLE_CLIENT_ID != '' && secrets.LOUVER_GOOGLE_CLIENT_SECRET != '' }}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD-INFO.txt
          cat BUILD-INFO.txt
          cat rc-results/ffmpeg-manifest.json >> BUILD-INFO.txt || true

      # Collected into one directory so the upload does not have to know each
      # bundler's layout, and so a bundler that produced nothing is caught
      # here rather than by an empty release.
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Cargo puts a cross-compiled build under target/<triple>/release.
          # The workspace target directory is the repository root, not
          # apps/desktop/src-tauri — getting this wrong uploads nothing.
          bundle="target/${{ matrix.target }}/release/bundle"
          ls -R "$bundle" || true
          found=0
          # -print0 and a read loop, because every bundler names its output
          # after the product — "Louver Live_1.0.0_amd64.deb" — and a bare
          # $(find) would split that on the space and copy neither half.
          while IFS= read -r -d '' f; do
            cp "$f" dist-release/
            found=$((found + 1))
          done < <(find "$bundle" -maxdepth 2 -type f \
                     \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
                        -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no installer was produced for ${{ matrix.target }}"
            exit 1
          fi
          cp BUILD-INFO.txt "dist-release/BUILD-INFO-${{ matrix.target }}.txt"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: louver-live-${{ matrix.target }}
          retention-days: 30
          path: dist-release/*

  # A run artifact expires and needs a GitHub login to download, so it is not
  # something a user can be sent to. A tag publishes a real Release instead.
  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: louver-live-*
          merge-multiple: true

      - name: List what is being published
        run: ls -la artifacts

      # A draft, not a live release. Every platform here is still marked
      # NOT TESTED against a real YouTube channel in
      # RELEASE_CANDIDATE_REPORT.md, so a person decides when it goes public.
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push names itself. A dispatch may name the tag it wants —
          # the draft release carries it and creates it on publish, which is
          # how a release is cut without push access to refs/tags.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || format('draft-{0}', github.run_number)) }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ## 설치

          | 운영체제 | 받을 파일 |
          | --- | --- |
          | Windows 10/11 (64비트) | `.exe` (권장) 또는 `.msi` |
          | Mac (M1 이상, Apple Silicon) | `aarch64.dmg` |
          | Mac (2020년 이전, Intel) | `x64.dmg` |
          | Linux (Ubuntu/Debian 계열) | `.deb` |
          | Linux (그 외) | `.AppImage` |

          Mac에서 어느 쪽인지 모르시면 왼쪽 위 사과 → **이 Mac에 관하여**를 열어
          "칩"이라고 적혀 있으면 Apple Silicon, "프로세서"라고 적혀 있으면 Intel입니다.

          `BUILD-INFO-*.txt`에 각 빌드의 커밋, 서명 여부, FFmpeg 출처가 들어 있습니다.
          EOF
          )
          gh release create "$TAG" \
            --draft \
            --target "$TARGET" \
            --title "Louver Live $TAG" \
            --notes "$notes" \
            artifacts/* \
            || gh release upload "$TAG" artifacts/* --clobber
          gh release view "$TAG" --json url --jq .url
