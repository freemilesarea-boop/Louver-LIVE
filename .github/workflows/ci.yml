name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Tauri's Linux build needs the webkit stack; the other runners do not.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      # A convenience, not a requirement: fetch-ffmpeg.mjs below downloads the
      # same static build the product ships, and FfmpegTools::discover looks in
      # binaries/ before it looks at PATH. Allowed to fail because this action
      # has no arm64 macOS build and errors out in under a second on
      # macos-latest, which is arm64 now.
      - name: Install FFmpeg (optional)
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3

      - run: npm ci
      - run: node scripts/fetch-ffmpeg.mjs

      - name: Verify
        run: node scripts/verify.mjs

      # Fixtures are generated, so a failure is worth keeping to inspect.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.os }}
          path: |
            tests/fixtures/
            soak-results/
          retention-days: 7

  bundle:
    name: bundle (${{ matrix.os }})
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Release bundles must ship the licence-cleared static build, never the
      # development fallback. --require-download fails instead of falling back.
      - name: Fetch FFmpeg sidecars
        run: node scripts/fetch-ffmpeg.mjs --require-download --force

      - name: Build
        run: npx tauri build
        env:
          LOUVER_LICENSE_PUBLIC_KEY: ${{ secrets.LOUVER_LICENSE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: louver-live-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          retention-days: 14
