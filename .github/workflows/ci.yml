name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Tauri's Linux build needs the webkit stack; the other runners do not.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - run: npm ci

      # The same download the release makes, so the media tests run against
      # the binary that ships rather than whatever the runner happened to
      # have. Two fallback installers used to stand behind this — `brew
      # install ffmpeg` and `FedericoCarboni/setup-ffmpeg` — and they are
      # gone: the second broke upstream ("Cannot get latest release") and
      # failed CI on Windows by itself, and the `sidecars` job below requires
      # the download on all four platforms regardless, so neither was
      # protecting the run from a download host being down any more.
      - run: node scripts/fetch-ffmpeg.mjs --force

      # The sidecars are named for their target triple, which no PATH lookup
      # will find. The tests that probe capabilities resolve `ffmpeg` from
      # PATH, so the downloaded build is put there under its plain name and
      # they test the shipped binary rather than skipping.
      - name: Put the downloaded FFmpeg on PATH
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ffmpeg-bin"
          mkdir -p "$dir"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for n in ffmpeg ffprobe; do
            src=$(ls apps/desktop/src-tauri/binaries/$n-* | head -1)
            cp "$src" "$dir/$n$ext"
            chmod +x "$dir/$n$ext" || true
          done
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg$ext" -version | head -1

      - name: Verify
        run: node scripts/verify.mjs

      # Fixtures are generated, so a failure is worth keeping to inspect.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.os }}
          path: |
            tests/fixtures/
            soak-results/
          retention-days: 7

  # The release path for the FFmpeg sidecars, run on every push instead of
  # first on a tag. Both v1.0.0 release failures lived in these three steps —
  # a macOS archive that has never contained ffprobe, and a Windows
  # provenance file looked for under a name nothing writes — and neither
  # could show up in the job above, which is allowed to fall back to the
  # runner's own FFmpeg. Same composite action the release uses, so they
  # cannot drift apart again. No compile, so it costs a minute or two.
  sidecars:
    name: sidecars (${{ matrix.target }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Two Intel labels on purpose, for one push. `macos-13` has not been
          # given a runner twice now — queued over an hour on the v1.0.0 tag
          # and again here, never starting a step — which is availability,
          # not anything in this repository. `macos-15-intel` is the label
          # that replaced it. Whichever one actually runs is the one the
          # release should ask for; this is how to find out without spending
          # a tag on the question. The loser comes out again.
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Place and check the FFmpeg sidecars
        uses: ./.github/actions/sidecars
        with:
          target: ${{ matrix.target }}

  bundle:
    name: bundle (${{ matrix.os }})
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Release bundles must ship the licence-cleared static build, never the
      # development fallback. --require-download fails instead of falling back.
      - name: Fetch FFmpeg sidecars
        run: node scripts/fetch-ffmpeg.mjs --require-download --force

      - name: Build
        run: npx tauri build
        env:
          LOUVER_LICENSE_PUBLIC_KEY: ${{ secrets.LOUVER_LICENSE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: louver-live-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          retention-days: 14
