[workspace]
resolver = "2"
members = [
    "crates/louver-core",
    "apps/desktop/src-tauri",
    "tools/license-generator",
]

[workspace.package]
version = "1.0.3"
edition = "2021"
rust-version = "1.77"
license = "Proprietary"
authors = ["Louver Live"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
base64 = "0.22"
sysinfo = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
