[package]
name = "louver-live-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolated worker that sends a YouTube Live picture with the playlist's sound (Beta). Separate process, separate state, no production database."

[dependencies]
# Reused verbatim, not reimplemented: the FFmpeg composition that already
# sends a live picture with the playlist's sound.
louver-core = { path = "../louver-core" }
# Reused for URL validation only (SSRF, private ranges, credentials, ports).
louver-cloud = { path = "../louver-cloud" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# Already in this project's tree: the token signature is HMAC-SHA-256 composed
# over `sha2` (RFC 2104, pinned against the RFC 4231 vectors), and `subtle`
# gives the constant-time comparison a signature check needs.
sha2.workspace = true
subtle = "2.6"
# The HTTP surface. axum, tokio and tower-http are the same versions
# `apps/server` already uses, so this adds no new crate to the workspace.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "3.2.1", features = ["json"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "live-source-worker"
path = "src/bin/live-source-worker.rs"

[[bin]]
name = "live-source-api"
path = "src/bin/live-source-api.rs"
