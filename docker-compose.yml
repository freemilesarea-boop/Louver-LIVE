# Development and small-scale production are the same file here, because the
# difference is the environment, not the topology.
#
#   cp .env.example .env        # then set LOUVER_MASTER_KEY
#   docker compose up -d --build            # http://<ip>:8080
#   docker compose --profile https up -d --build   # needs LOUVER_DOMAIN
services:
  louver:
    build: .
    # A broadcast must survive a restart of the host, and the server brings back
    # whatever was still meant to be running.
    restart: unless-stopped
    ports:
      - '${LOUVER_PORT:-8080}:8080'
    # Optional so that a missing .env fails with the message below — "set
    # LOUVER_MASTER_KEY in .env" — instead of a stat error about a file the
    # reader has not been told to create yet.
    env_file:
      - path: .env
        required: false
    environment:
      # Read at boot; the server refuses to start without it, rather than
      # inventing a key that would orphan every saved stream key.
      LOUVER_MASTER_KEY: ${LOUVER_MASTER_KEY:?set LOUVER_MASTER_KEY in .env}
      LOUVER_DEFAULT_PLAN: ${LOUVER_DEFAULT_PLAN:-basic}
      LOUVER_ENCODER: ${LOUVER_ENCODER:-libx264}
    volumes:
      # The database, the originals and the prepared copies.
      - louver-data:/var/lib/louver
    # No CPU or memory ceiling by default. Docker refuses a `cpus` limit larger
    # than the host has, so a default of 4 made every 2-vCPU server fail to
    # start — and the server is one process whose work is FFmpeg, which there is
    # no reason to starve on a box dedicated to it. To cap it anyway:
    #   docker compose -f docker-compose.yml -f docker-compose.limits.yml up -d
    healthcheck:
      test: ['CMD', 'louver-server', '--health-check']
      interval: 30s
      timeout: 5s
      start_period: 15s

  # HTTPS, only when you ask for it:  docker compose --profile https up -d --build
  #
  # A domain pointed at this server gets a real certificate automatically. With
  # it in front, set LOUVER_COOKIE_SECURE=always and publish the app on
  # loopback only (LOUVER_PORT=127.0.0.1:8080) so nothing reaches it unencrypted.
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # No `:?` here. Compose interpolates the entire file before it decides
      # which profiles are active, so a required-variable marker in this
      # inactive service aborted every IP-only deployment. The `https` profile
      # is opt-in; when it is on and this is empty, Caddy says so itself.
      LOUVER_DOMAIN: ${LOUVER_DOMAIN:-}
      LOUVER_TLS_EMAIL: ${LOUVER_TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - louver

volumes:
  louver-data:
  caddy-data:
  caddy-config:
